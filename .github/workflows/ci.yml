name: CI

on:
  push:
  pull_request:
  schedule:
    # do this every day at 7AM UTC
    - cron: "0 7 * * *"
jobs:
  build:
    name: test ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: canary
      - name: Install packages
        run: deno install
      - name: Lint
        run: deno lint
      - uses: dprint/check@v2.2
      # tsgo (TypeScript 7.0+) is the Go port. The vendored JS clients and wasms of both
      # selectable builds — the latest release and the nightly — are generated from
      # typescript-go, not committed. Vendor the clients first (fast, no Go) so
      # `deno check` can type-check against them; the slower wasm builds follow. Done on
      # every run so PRs verify both builds too.
      - name: Vendor tsgo clients
        run: deno task buildTsgo --skip-wasm
      - name: Check
        run: deno task check
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build tsgo wasms (latest release + nightly from typescript-go main)
        run: deno task buildTsgo
      - name: Build
        run: |
          deno task addTypeScriptVersions
          deno task updateCompilerFiles
          deno task test
          deno task predeploy
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          branch: gh-pages
          folder: dist
          single-commit: true
